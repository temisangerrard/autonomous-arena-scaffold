name: Deploy Cloudflare Worker

# Deploys the arena-backend Cloudflare Worker on every push to main
# that touches the worker source, and on manual dispatch.
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN   — API token with Worker:Edit permission
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID
#   QWEN_API_KEY           — DashScope API key for Chief LLM fallback

on:
  push:
    branches: [main]
    paths:
      - "apps/cloudflare-backend/**"
      - "apps/web/src/playerShell*"
      - "packages/shared/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.check.outputs.can_deploy }}
    steps:
      - name: Check Cloudflare secrets
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Cloudflare deploy: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set."
          fi

  deploy-worker:
    needs: preflight
    if: needs.preflight.outputs.can_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        working-directory: apps/cloudflare-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --minify

      - name: Set QWEN_API_KEY secret
        if: ${{ secrets.QWEN_API_KEY != '' }}
        working-directory: apps/cloudflare-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: echo "$QWEN_API_KEY" | npx wrangler secret put QWEN_API_KEY
