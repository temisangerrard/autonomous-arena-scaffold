name: Deploy Backend (Fly.io)

# Deploys arena-server, arena-agent-runtime, and arena-web to Fly.io
# whenever relevant files change on main. Runs in parallel with the
# Netlify deploy so both land together — preventing the "server drift"
# where Netlify gets new frontend JS but Fly still runs old server code.
#
# Required secret: FLY_API_TOKEN (Fly personal access token)
# Generate at: https://fly.io/user/personal_access_tokens

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "apps/agent-runtime/**"
      - "apps/web/src/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile.server"
      - "Dockerfile.agent-runtime"
      - "Dockerfile.web"
      - "fly.server.toml"
      - "fly.agent-runtime.toml"
      - "fly.web.toml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      deploy_server:
        description: "Deploy arena-server (game WebSocket)"
        required: true
        default: "true"
        type: boolean
      deploy_runtime:
        description: "Deploy arena-agent-runtime"
        required: true
        default: "true"
        type: boolean
      deploy_web:
        description: "Deploy arena-web (web API)"
        required: true
        default: "true"
        type: boolean

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.check.outputs.can_deploy }}
    steps:
      - name: Check Fly token
        id: check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Fly deploy: FLY_API_TOKEN secret is not set. Add it at repo Settings > Secrets."
          fi

  changes:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      runtime: ${{ steps.filter.outputs.runtime }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'apps/server/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile.server'
              - 'fly.server.toml'
            runtime:
              - 'apps/agent-runtime/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile.agent-runtime'
              - 'fly.agent-runtime.toml'
            web:
              - 'apps/web/public/**'
              - 'apps/web/src/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Dockerfile.web'
              - 'fly.web.toml'

  deploy-server:
    needs: [preflight, changes]
    if: |
      needs.preflight.outputs.can_deploy == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_server == 'true') ||
        (github.event_name != 'workflow_dispatch' && needs.changes.outputs.server == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy arena-server
        run: flyctl deploy --app arena-server-broken-haze-6531 --config fly.server.toml --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-runtime:
    needs: [preflight, changes]
    if: |
      needs.preflight.outputs.can_deploy == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_runtime == 'true') ||
        (github.event_name != 'workflow_dispatch' && needs.changes.outputs.runtime == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy arena-agent-runtime
        run: flyctl deploy --app arena-agent-runtime --config fly.agent-runtime.toml --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-web:
    needs: [preflight, changes]
    if: |
      needs.preflight.outputs.can_deploy == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_web == 'true') ||
        (github.event_name != 'workflow_dispatch' && needs.changes.outputs.web == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy arena-web
        run: flyctl deploy --app arena-web --config fly.web.toml --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
